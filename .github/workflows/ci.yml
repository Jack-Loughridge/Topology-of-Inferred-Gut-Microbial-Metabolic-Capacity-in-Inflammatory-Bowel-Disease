name: Publication checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Integrity and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: environment/requirements-ci.txt
      - name: Install metadata validator
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run repository integrity checks
        run: python run_checks.py static

  unit:
    name: Scientific unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: environment/requirements-ci.txt
      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r environment/requirements-ci.txt
      - name: Validate imports and versions
        run: python environment/validate_analysis_environment.py
      - name: Run component unit suites
        run: python run_checks.py unit
