name: Full synthetic reproducibility checks

on:
  # Bootstrap validation while this workflow exists only on the publication
  # branch. This runs only when this workflow file itself changes on that branch.
  push:
    branches:
      - publication/rebuild-2026
    paths:
      - .github/workflows/full-synthetic.yml
  # Becomes available for ordinary manual runs after the workflow reaches main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-synthetic:
    name: All unit and synthetic self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: environment/requirements-ci.txt
      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r environment/requirements-ci.txt
      - name: Validate imports and versions
        run: python environment/validate_analysis_environment.py
      - name: Run all repository tests
        run: python run_checks.py full
