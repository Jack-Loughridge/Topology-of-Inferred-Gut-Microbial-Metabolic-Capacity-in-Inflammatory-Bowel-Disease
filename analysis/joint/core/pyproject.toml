[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h0-ricci-joint-sparse"
version = "1.2.0"
description = "Leak-safe nested participant-grouped joint WKPI and faithful Ricci sparse classifier"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jack Loughridge"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "threadpoolctl>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
h0-ricci-joint-sparse = "h0_ricci_joint_sparse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
