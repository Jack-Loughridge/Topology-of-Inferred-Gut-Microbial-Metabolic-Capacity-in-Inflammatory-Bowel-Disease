name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Static syntax checks
        run: |
          python -m compileall -q .
          bash -n launch_tmux.sh
      - name: Patcher regression test
        run: python install_core_patch.py --self-test
      - name: End-to-end synthetic self-test
        run: python self_test.py
      - name: Unit tests
        run: pytest -q
